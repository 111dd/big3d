    <script>
    document.addEventListener('DOMContentLoaded',()=>safeCreateIcons());
    (function(){
        var btn=document.getElementById('mobile-menu-toggle'),menu=document.getElementById('menu');
        if(!btn||!menu)return;
        function closeMenu(){menu.classList.add('hidden');btn.setAttribute('aria-expanded','false')}
        btn.addEventListener('click',function(){var open=!menu.classList.toggle('hidden');btn.setAttribute('aria-expanded',open?'true':'false')});
        menu.addEventListener('click',function(e){if(e.target.closest('a'))closeMenu()});
        document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!menu.classList.contains('hidden')){closeMenu();btn.focus()}});
    })();
